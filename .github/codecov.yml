codecov:
  notify:
    require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 0%
        paths:
          - "^src/(?!thpool\\.c$).*"
          - "^include/(?!(xxhash|thpool)\\.h$).*"
    patch:
      default:
        target: auto
        threshold: 0%
        paths:
          - "^src/(?!thpool\\.c$).*"
          - "^include/(?!(xxhash|thpool)\\.h$).*"

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: yes

comment: false

ignore:
  - "^include/xxhash\\.h$"
  - "^include/thpool\\.h$"
  - "^src/thpool\\.c$"
  - "test/**"
