name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # available runners: https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest", "ubuntu-22.04", "macos-15-intel"]') }}
        compiler:
          - gcc
          - llvm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup MacOS environment
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install coreutils ctags
          echo "$(brew --prefix)/opt/gnu-sed/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Linux environment
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update -y
          sudo apt-get install -y exuberant-ctags

      - name: Setup compiler
        uses: aminya/setup-cpp@15a6bd8cf39030f88b5da3d203a829ec4eea4955 # v1.10.1
        with:
          compiler: ${{ matrix.compiler }}
          gcovr: "8.8"

      - name: Setup test environment
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 10), "Python 3.10+ required"'
          python3 -m venv "$RUNNER_TEMP/duplicut-tests"
          "$RUNNER_TEMP/duplicut-tests/bin/python" -m pip install -r tests/requirements.txt
          echo "$RUNNER_TEMP/duplicut-tests/bin" >> "$GITHUB_PATH"

      - name: Run test suite
        run: make test

      - name: Setup $GCOV executable (llvm)
        if: matrix.compiler == 'llvm'
        run: |
          echo GCOV=$(dirname $(which $CC))/llvm-cov gcov >> $GITHUB_ENV

      - name: Setup $GCOV executable (gcc)
        if: matrix.compiler == 'gcc'
        run: |
          echo GCOV=$(dirname $(which $CC))/gcov-$($CC -dumpversion|cut -d. -f1) >> $GITHUB_ENV

      - name: Collect coverage info with gcovr
        run: |
          gcovr --config .github/gcovr.cfg # for debug
          gcovr --config .github/gcovr.cfg --fail-under-line 30 --delete --xml coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
          flags: ${{ runner.os }}
          name: ${{ matrix.os }}-${{ matrix.compiler }}-coverage
          gcov_executable: ${{ env.GCOV }}
          files: coverage.xml
